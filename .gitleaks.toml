title = "LedgerFlow secret detection"

[extend]
useDefault = true

[[allowlists]]
description = "Fixed synthetic JWT subject UUID in unit tests, not a credential; signing keys are random per test."
condition = "AND"
paths = ['''^src/test/java/com/ledgerflow/auth/JwtValidationTest\.java$''']
regexTarget = "secret"
regexes = ['''^c65e10a9-235c-4310-a8e8-15a596c844e1$''']
