name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run unit and PostgreSQL integration tests
        run: ./mvnw -B -ntp -Pintegration verify dependency:tree -DoutputType=json -DoutputFile=target/dependencies.json
      - name: Audit Maven dependencies against OSV
        run: node scripts/audit-maven.mjs
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Scan secrets with checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  $archive$" checksums.txt | sha256sum --check --strict)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all --config .gitleaks.toml .
      - name: Prepare ephemeral compose credentials
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -base64 36 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "APP_PORT=18080" >> "$GITHUB_ENV"
          echo "WEB_PORT=18081" >> "$GITHUB_ENV"
          echo "DB_PORT=15432" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=ledgerflow-ci" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Run browser workflows against PostgreSQL-backed services
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/fullstack.spec.ts
      - name: Remove only the ephemeral CI stack
        if: always()
        run: docker compose -p ledgerflow-ci down -v
