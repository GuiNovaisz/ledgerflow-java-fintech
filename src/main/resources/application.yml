spring:
  application:
    name: ledgerflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USER:ledgerflow}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 15m
      tracking-modes: cookie
      cookie:
        name: LEDGERFLOW_SESSION
        path: /
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
ledgerflow:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ledgerflow
    ttl: PT15M
springdoc:
  swagger-ui:
    path: /swagger-ui.html
